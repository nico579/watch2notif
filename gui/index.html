<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch2notif</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>watch2notif<span class="v"><span id="server-version"></span> (<span id="server-pid"></span>)</span></h1>
  <div class="topbar-right">
    <a class="help-link" href="https://github.com/nico579/watch2notif#readme"
       target="_blank" rel="noopener" data-i18n="help_link"></a>
    <span id="nico579-reglages"></span>
    <div class="lang-toggle" id="lang-toggle" data-nico579-langue></div>
  </div>
</header>

<nav class="tabs">
  <button type="button" class="tab-btn active" data-tab="settings" data-i18n="tab_feeds"></button>
  <button type="button" class="tab-btn" data-tab="history" data-i18n="tab_history"></button>
</nav>

<main>
  <section id="tab-settings" class="tab-panel">
    <table id="feeds-table">
      <thead>
        <tr>
          <th data-i18n="header_active"></th>
          <th data-i18n="header_kind"></th>
          <th data-i18n="header_name"></th>
          <th data-i18n="header_url"></th>
          <th data-i18n="header_interval"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="feeds-body"></tbody>
    </table>

    <button type="button" id="add-feed-btn" data-i18n="add_feed_button"></button>
    <p id="note-text" class="note" data-i18n="note_text"></p>

    <div class="transfer-row">
      <button type="button" id="pair-start-btn" data-i18n="pair_send_button"></button>
      <button type="button" id="config-import-btn" data-i18n="config_import_button"></button>
      <button type="button" id="config-export-btn" data-i18n="config_export_button"></button>
      <input type="file" id="config-import-file" accept="application/json,.json" hidden>
    </div>
    <p class="note" data-i18n="config_transfer_note"></p>

    <div class="save-row">
      <span id="save-status" class="save-status"></span>
      <button type="button" id="save-btn" data-i18n="save_button"></button>
    </div>
  </section>

  <section id="tab-history" class="tab-panel" hidden>
    <p data-i18n="history_hint_text"></p>
    <table id="history-table">
      <thead>
        <tr>
          <th data-i18n="history_header_date"></th>
          <th data-i18n="history_header_source"></th>
          <th data-i18n="history_header_title"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
    <button type="button" id="history-clear-btn" data-i18n="history_clear_button"></button>
  </section>
</main>

<dialog id="pair-dialog">
  <h2 data-i18n="pair_title"></h2>
  <p class="note" data-i18n="pair_note"></p>
  <label class="note" for="pair-address" data-i18n="pair_address_label"></label>
  <select id="pair-address"></select>
  <p id="pair-network-note" class="note"></p>
  <p id="pair-firewall-status" class="note" role="status" aria-live="polite"></p>
  <img id="pair-qr" alt="" width="340" height="340" hidden>
  <p id="pair-status" class="note" aria-live="polite"></p>
  <button type="button" id="pair-renew-btn" data-i18n="pair_renew_button"></button>
  <div id="pair-firewall" hidden>
    <p class="note" data-i18n="pair_firewall_note"></p>
    <button type="button" id="pair-allow-btn" data-i18n="pair_allow_button"></button>
  </div>
  <button type="button" id="pair-close-btn" data-i18n="pair_close_button"></button>
</dialog>

<script src="/app.js"></script>
<script src="/nico579-maj.js"></script>
<script src="/nico579-reglages.js"></script>
<script src="/nico579-langue.js"></script>
</body>
</html>
