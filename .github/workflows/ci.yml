name: CI

# Verifie sur les trois systemes le code pur (dont l'updater et ses archives
# hostiles) puis la construction PyInstaller. Les notifications natives
# demandent toujours une vraie session graphique et restent hors de ce smoke.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

# Droits minimaux du GITHUB_TOKEN : lecture seule. Un job qui publie
# déclare lui-même le droit d'écriture dont il a besoin.
permissions:
  contents: read

jobs:
  syntaxe:
    name: syntaxe et imports ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install --quiet --require-hashes -r requirements.txt

      - name: Compiler tous les modules
        run: python -m compileall -q .

      - name: Tester l'application, l'updater et l'appairage
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.log

      - name: Verifier le JavaScript de l'interface
        run: node --check gui/app.js

      - name: Verifier que autostart_manager expose bien is_enabled/enable/disable
        run: python -c "import autostart_manager as a; assert callable(a.is_enabled) and callable(a.enable) and callable(a.disable)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-desktop-tests-${{ matrix.os }}
          path: test-results.log
          if-no-files-found: ignore

  bundle:
    name: bundle ${{ matrix.os }}
    needs: [syntaxe, verrous]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            notifier: dist/watch2notif/watch2notif.exe
            output: dist/watch2notif/
            asset: watch2notif-windows-x86_64
          - os: ubuntu-22.04
            notifier: dist/watch2notif/watch2notif
            output: dist/watch2notif/
            asset: watch2notif-linux-x86_64
          - os: macos-latest
            notifier: dist/watch2notif.app/Contents/MacOS/watch2notif
            output: dist/watch2notif.app/
            asset: watch2notif-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Construire le bundle
        run: python build.py

      - name: Verifier que l'executable existe
        shell: bash
        run: test -f "${{ matrix.notifier }}" || { echo "notifier manquant"; exit 1; }

      # Le binaire lui-meme, pas seulement sa presence : --self-test-version
      # charge tout le programme (une dependance oubliee au moment
      # d'empaqueter, nico579-commons par exemple, le ferait echouer),
      # verifie la version et l'icone, puis sort sans rien demarrer.
      - name: Lancer l'executable (imports, version, icone)
        shell: bash
        run: |
          version=$(python -c "import update_check; print(update_check.VERSION)")
          "${{ matrix.notifier }}" --self-test-version "$version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}-ci
          path: ${{ matrix.output }}
          if-no-files-found: error

  # Chaque système de construction de release.yml (windows-latest,
  # ubuntu-22.04, macos-latest) doit pouvoir installer les deux verrous, avec
  # son Python 3.12 : un verrou régénéré qui choisirait une version sans roue
  # pour l'un d'eux casserait sa construction, le jour de la release. Les
  # paquets livrés en source sont listés par système, exactement : un nouveau
  # paquet sans roue fait échouer ce job au lieu de passer inaperçu.
  #   pync : publié en source seulement, macOS uniquement.
  verrous:
    name: Verrous des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.9.28
      - name: Roues pour les trois systemes de construction
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          for verrou in requirements.txt requirements-build.txt; do
            for cible in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
              case "$cible" in
                aarch64-apple-darwin) sources="pync" ;;
                *) sources="" ;;
              esac
              echo "== $verrou pour $cible (en source : ${sources:-aucun})"
              uv pip compile "$verrou" --python-platform "$cible" --python-version 3.12                 --only-binary :all: ${sources:+--no-binary "$sources"} --no-header -q -o /tmp/roues.txt
            done
          done
