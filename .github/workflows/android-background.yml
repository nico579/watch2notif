name: Android background smoke

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  monitoring:
    name: Veille et reprise Android ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;35.0.0'
          printf '%s\n' "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Construire uniquement sur GitHub
        working-directory: android
        run: bash gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
      - name: Autoriser KVM sur le runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Veille profonde et reprise sur le SDK officiel
        env:
          MONITOR_API: ${{ matrix.api }}
        run: bash tools/run_android_emulator.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-background-api-${{ matrix.api }}
          path: |
            android/build/background-smoke-api-*.json
            android/build/emulator-api-*.log
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
