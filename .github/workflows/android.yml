name: Android CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint et APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare SDK
        run: |
          set -euo pipefail
          # Le runner fournit le SDK, sans ajouter sdkmanager au PATH.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager" || { echo "::error::SDK manager absent : $sdk_manager"; exit 1; }
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests et Android Lint
        working-directory: android
        run: bash gradlew testDebugUnitTest testReleaseUnitTest lintDebug lintRelease --no-daemon --max-workers=2 --console=plain
      - name: Construire les variantes de CI
        working-directory: android
        run: bash gradlew assembleDebug assembleRelease bundleRelease --no-daemon --max-workers=2 --console=plain
      - name: Verifier les rapports et les archives Android
        run: >-
          python3 tools/verify_android_build.py
          --apk android/app/build/outputs/apk/debug/app-debug.apk
          --apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          --aab android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-android-checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/build/qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch2notif-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
