name: Android CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint et APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests et Android Lint
        working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug --no-daemon --console=plain
      - name: Construire l'APK de CI
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-android-checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/build/qa/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch2notif-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
