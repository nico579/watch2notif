name: Release (build 3 OS)

# Construit les bundles autonomes sur les trois systemes puis les publie sur
# la release. PyInstaller n'est pas un compilateur croise : chaque binaire
# doit etre produit sur son systeme natif. Les runners GitHub le font
# gratuitement.
#
# Declenchement :
#   - poussee d'une etiquette v*   (git tag v0.1.0 && git push origin v0.1.0)
#   - manuel, en indiquant l'etiquette
#
# Fichiers produits :
#   watch2notif-windows-x86_64.zip
#   watch2notif-linux-x86_64.tar.gz
#   watch2notif-macos-arm64.zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiquette de la release (ex : v0.1.0)"
        required: true

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: watch2notif-windows-x86_64
            archive: zip
          - os: ubuntu-22.04
            asset: watch2notif-linux-x86_64
            archive: tar
          - os: macos-latest
            asset: watch2notif-macos-arm64
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances systeme pour tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk

      # Le meme build.py qu'en local : une seule recette a maintenir, et ce
      # qui est publie est exactement ce qu'on peut reproduire chez soi.
      - name: Construire le bundle
        run: python build.py

      - name: Empaqueter (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: cd dist && 7z a -tzip "${{ matrix.asset }}.zip" watch2notif || zip -r "${{ matrix.asset }}.zip" watch2notif

      - name: Empaqueter (tar.gz)
        if: matrix.archive == 'tar'
        run: cd dist && tar czf "${{ matrix.asset }}.tar.gz" watch2notif

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*

  publish:
    name: publier la release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artefacts/**/*
          generate_release_notes: true
