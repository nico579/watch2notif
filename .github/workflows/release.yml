name: Release (desktop et Android)

# Tous les binaires sont construits sur GitHub, apres les tests du meme tag.
# L'APK et l'AAB partagent une cle de signature durable stockee dans les secrets.
# Aucun diagnostic de test ni secret n'est joint a la release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiquette de la release (ex : v0.11.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verrous:
    name: Verrous des dependances de distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.9.28
      - name: Roues pour les trois systemes de construction
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          for verrou in requirements.txt requirements-build.txt; do
            for cible in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
              case "$cible" in
                aarch64-apple-darwin) sources="pync" ;;
                *) sources="" ;;
              esac
              uv pip compile "$verrou" --python-platform "$cible" --python-version 3.12 \
                --only-binary :all: ${sources:+--no-binary "$sources"} --no-header -q -o /tmp/roues.txt
            done
          done

  build:
    name: Tests et bundle ${{ matrix.os }}
    needs: verrous
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: watch2notif-windows-x86_64
            archive: zip
            notifier: dist/watch2notif/watch2notif.exe
          - os: ubuntu-22.04
            asset: watch2notif-linux-x86_64
            archive: tar
            notifier: dist/watch2notif/watch2notif
          - os: macos-latest
            asset: watch2notif-macos-arm64
            archive: zip
            notifier: dist/watch2notif.app/Contents/MacOS/watch2notif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verifier le tag et la version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python -c "import os, update_check; tag=os.environ['RELEASE_TAG']; assert tag == 'v' + update_check.VERSION, f'{tag} ne correspond pas a VERSION={update_check.VERSION}'"
      - name: Installer les dependances verrouillees
        run: python -m pip install --quiet --require-hashes -r requirements.txt
      - name: Verifier les modules et l'interface
        shell: bash
        run: |
          python -m compileall -q .
          node --check gui/app.js
      - name: Tester l'application, l'updater et l'appairage
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-desktop-tests-${{ matrix.os }}
          path: test-results.log
          if-no-files-found: ignore
      - name: Construire le bundle
        run: python build.py
      - name: Lancer le binaire (imports, version, icone)
        shell: bash
        run: |
          version=$(python -c "import update_check; print(update_check.VERSION)")
          "${{ matrix.notifier }}" --self-test-version "$version"
      - name: Empaqueter (zip, Windows)
        if: matrix.archive == 'zip' && runner.os == 'Windows'
        shell: bash
        run: cd dist && 7z a -tzip "${{ matrix.asset }}.zip" watch2notif
      - name: Empaqueter (zip, macOS)
        if: matrix.archive == 'zip' && runner.os == 'macOS'
        run: cd dist && zip -r -y "${{ matrix.asset }}.zip" watch2notif.app
      - name: Empaqueter (tar.gz)
        if: matrix.archive == 'tar'
        run: cd dist && tar czf "${{ matrix.asset }}.tar.gz" watch2notif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

  android:
    name: Tests et distribution Android signee
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verifier le tag et la version Android
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python -c "import os, update_check; tag=os.environ['RELEASE_TAG']; assert tag == 'v' + update_check.VERSION, f'{tag} ne correspond pas a VERSION={update_check.VERSION}'"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparer le SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests et Android Lint (debug et release)
        working-directory: android
        run: bash gradlew testDebugUnitTest testReleaseUnitTest lintDebug lintRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-android-checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/build/qa/
          if-no-files-found: ignore
      - name: Construire et verifier l'APK et l'AAB signes
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WATCH2NOTIF_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WATCH2NOTIF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WATCH2NOTIF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 WATCH2NOTIF_STORE_PASSWORD WATCH2NOTIF_KEY_ALIAS WATCH2NOTIF_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Secret de signature Android manquant : $variable"
              exit 1
            fi
          done
          umask 077
          export WATCH2NOTIF_KEYSTORE="$RUNNER_TEMP/watch2notif-release.jks"
          trap 'rm -f "$WATCH2NOTIF_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$WATCH2NOTIF_KEYSTORE"
          bash gradlew assembleRelease bundleRelease --no-daemon --console=plain
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$aab" > "$RUNNER_TEMP/aab-signature.log"
          cat "$RUNNER_TEMP/aab-signature.log"
          grep -q '^jar verified\.$' "$RUNNER_TEMP/aab-signature.log"
          version=$(python -c "import sys; sys.path.insert(0, '..'); import update_check; print(update_check.VERSION)")
          version_code=$(python -c "import sys; sys.path.insert(0, '..'); import update_check; a,b,c=map(int, update_check.VERSION.split('.')); print(a*1000000+b*1000+c)")
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "versionName='$version'" >/dev/null
          printf '%s\n' "$badging" | grep -F "versionCode='$version_code'" >/dev/null
          # Outil officiel Google, version et empreinte fixes : le manifeste
          # protobuf de l'AAB est controle independamment de celui de l'APK.
          bundletool="$RUNNER_TEMP/bundletool-1.18.3.jar"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$bundletool"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$bundletool" | sha256sum --check
          test "$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath='/manifest/@android:versionName')" = "$version"
          test "$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath='/manifest/@android:versionCode')" = "$version_code"
          mkdir -p ../dist
          cp "$apk" ../dist/watch2notif-android.apk
          cp "$aab" ../dist/watch2notif-android.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch2notif-android
          path: |
            dist/watch2notif-android.apk
            dist/watch2notif-android.aab
          if-no-files-found: error

  publish:
    name: Publier les cinq fichiers de distribution
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: watch2notif-*
          path: artefacts
          merge-multiple: true
      - name: Verifier les fichiers et calculer leurs empreintes
        working-directory: artefacts
        run: |
          set -euo pipefail
          for fichier in watch2notif-windows-x86_64.zip watch2notif-linux-x86_64.tar.gz watch2notif-macos-arm64.zip watch2notif-android.apk watch2notif-android.aab; do
            test -s "$fichier"
          done
          sha256sum watch2notif-* > SHA256SUMS.txt
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artefacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artefacts/* --generate-notes --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
