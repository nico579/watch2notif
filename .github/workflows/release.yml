name: Release (build 3 OS)

# Construit les bundles autonomes sur les trois systemes puis les publie sur
# la release. PyInstaller n'est pas un compilateur croise : chaque binaire
# doit etre produit sur son systeme natif. Les runners GitHub le font
# gratuitement.
#
# Declenchement :
#   - poussee d'une etiquette v*   (git tag v0.1.0 && git push origin v0.1.0)
#   - manuel, en indiquant l'etiquette
#
# Fichiers produits :
#   watch2notif-windows-x86_64.zip
#   watch2notif-linux-x86_64.tar.gz
#   watch2notif-macos-arm64.zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiquette de la release (ex : v0.1.0)"
        required: true

# Droits minimaux du GITHUB_TOKEN : lecture seule. Un job qui publie
# déclare lui-même le droit d'écriture dont il a besoin.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: watch2notif-windows-x86_64
            archive: zip
          - os: ubuntu-22.04
            asset: watch2notif-linux-x86_64
            archive: tar
          - os: macos-latest
            asset: watch2notif-macos-arm64
            archive: zip

    steps:
      # Sans ref explicite, un declenchement manuel (workflow_dispatch)
      # checkoute la branche par defaut, pas l'etiquette saisie dans le
      # formulaire : la release publierait alors le code de master sous le
      # nom de l'etiquette au lieu du commit qu'elle designe reellement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verifier que le tag correspond a la version du binaire
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python -c "import os, update_check; tag=os.environ['RELEASE_TAG'].lstrip('vV'); assert tag == update_check.VERSION, f'le tag {tag} ne correspond pas a VERSION={update_check.VERSION}'"

      # Le meme build.py qu'en local : une seule recette a maintenir, et ce
      # qui est publie est exactement ce qu'on peut reproduire chez soi.
      - name: Construire le bundle
        run: python build.py

      - name: Empaqueter (zip, Windows)
        if: matrix.archive == 'zip' && runner.os == 'Windows'
        shell: bash
        run: cd dist && 7z a -tzip "${{ matrix.asset }}.zip" watch2notif || zip -r "${{ matrix.asset }}.zip" watch2notif

      - name: Empaqueter (zip, macOS)
        # watch2notif.spec produit une vraie .app (cible BUNDLE) sur macOS,
        # a cote du dossier watch2notif/ ordinaire : c'est elle qu'on
        # publie. -y preserve les liens symboliques du bundle (non teste,
        # pas de Mac ici : a verifier sur un vrai build).
        if: matrix.archive == 'zip' && runner.os == 'macOS'
        run: cd dist && zip -r -y "${{ matrix.asset }}.zip" watch2notif.app

      - name: Empaqueter (tar.gz)
        if: matrix.archive == 'tar'
        run: cd dist && tar czf "${{ matrix.asset }}.tar.gz" watch2notif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*

  publish:
    name: publier la release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      # gh, la CLI officielle de GitHub déjà présente sur le runner, plutôt
      # qu'une action tierce dans le seul job qui a le droit d'écrire : un tag
      # d'action déplacé par un attaquant y remplacerait les archives que la
      # mise à jour intégrée installe. Même principe que release.yml de
      # lidar2map. L'étiquette passe par l'environnement, jamais interpolée
      # dans le script : l'entrée manuelle « tag » ne peut rien y injecter.
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artefacts/*/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artefacts/*/* --generate-notes --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
